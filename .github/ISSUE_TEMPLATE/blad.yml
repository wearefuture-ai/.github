name: Błąd
description: Coś działa inaczej, niż powinno
labels: ["bug"]
body:
  - type: textarea
    id: co
    attributes:
      label: Co się dzieje
    validations:
      required: true
  - type: textarea
    id: oczekiwane
    attributes:
      label: Czego oczekiwaliśmy
    validations:
      required: true
  - type: textarea
    id: kroki
    attributes:
      label: Jak powtórzyć
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: slad
    attributes:
      label: Komunikaty, logi, zrzuty
      description: Bez sekretów i danych osobowych.
